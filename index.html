<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Survey</title>
    </head>
    <body>
        <div class="Survey">
        <header>
        <h1>Welcome to the Survey</h1>
        <p>We are glad that you have taken the time to participate in our survey.
            Please answer the following questions honestly and to the best of your ability. Your feedback is valuable to us and will help us improve our services.
        </p>
    </header>
    <form action="/survey-submit" method="POST">
        <label for="full-name">Full Name:</label>
        <input type="text"
            id="full-name" 
            name="full-name" 
            required
            placeholder="full name">
        <label for="age">Age:</label>
        <input type="number"
            id="age"
            name="age"
            required
            min="10"
            max="100">
        <label for="email">Email:</label>
        <input type="email"
            id="email"
            name="email"
            placeholder="optional">
        
<!--TODO=Make a table man use tr,th(bold header),td(normal)-->
    </form>
        </div>
    </body>
</html>
